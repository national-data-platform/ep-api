name: Publish Docker image

# Publishing used to be a manual step, so a GitHub release could be tagged while
# Docker Hub still served the previous image. Building from the release event
# keeps the two in step.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and push, e.g. 0.34.17'
        required: true
      update_latest:
        description: 'Also move the latest tag'
        type: boolean
        default: true

env:
  IMAGE: rbardaji/ndp-ep-api

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Resolve the version and the tags to push
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            raw='${{ github.event.release.tag_name }}'
            prerelease='${{ github.event.release.prerelease }}'
            if [ "$prerelease" = "true" ]; then latest=false; else latest=true; fi
          else
            raw='${{ inputs.version }}'
            latest='${{ inputs.update_latest }}'
          fi
          version="${raw#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<TAGS_EOF'
            echo "${IMAGE}:${version}"
            # A prerelease must not move `latest`, or `docker pull` would hand
            # every user an unreleased build.
            if [ "$latest" = "true" ]; then
              echo "${IMAGE}:latest"
            fi
            echo 'TAGS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Fail if the release tag and swagger_version disagree
        run: python scripts/check_release_version.py "${{ steps.meta.outputs.version }}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.allinone
          # linux/amd64 only, matching what has always been published. Adding
          # linux/arm64 here means emulating the React and pip builds under
          # QEMU, which takes far longer than a native build.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise what was pushed
        run: |
          {
            echo "### Pushed to Docker Hub"
            echo ''
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
