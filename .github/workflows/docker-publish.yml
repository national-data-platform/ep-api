name: Publish Docker image

# The GitHub release is created by this workflow, as its final step, rather than
# being the thing that triggers it. Publishing the release first left a window
# where a release existed but its image did not: `docker pull` then served the
# previous version while the release notes described the new one. Ordering it
# this way means a failed push leaves no release at all, and recovering is
# re-running the workflow rather than deleting and re-cutting a release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and push, e.g. 0.34.18'
        required: true
      update_latest:
        description: 'Also move the latest tag'
        type: boolean
        default: true

env:
  IMAGE: rbardaji/ndp-ep-api

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Resolve the version and the tags to push
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            raw='${{ github.ref_name }}'
            latest=true
          else
            raw='${{ inputs.version }}'
            latest='${{ inputs.update_latest }}'
          fi
          version="${raw#v}"
          # A SemVer prerelease carries an identifier after a hyphen
          # (0.35.0-rc1). There is no release object to ask any more, so the
          # version string is what decides: a prerelease must never move
          # `latest`, or `docker pull` hands users an unreleased build.
          prerelease=false
          case "$version" in
            *-*) prerelease=true; latest=false ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<TAGS_EOF'
            echo "${IMAGE}:${version}"
            if [ "$latest" = "true" ]; then
              echo "${IMAGE}:latest"
            fi
            echo 'TAGS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Fail if the tag and swagger_version disagree
        run: python scripts/check_release_version.py "${{ steps.meta.outputs.version }}"

      - name: Read the release notes from the CHANGELOG
        run: |
          set -euo pipefail
          python scripts/extract_changelog.py "${{ steps.meta.outputs.version }}" \
            > release-notes.md
          echo "Release notes for ${{ steps.meta.outputs.version }}:"
          cat release-notes.md

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.allinone
          # linux/amd64 only, matching what has always been published. Adding
          # linux/arm64 here means emulating the React and pip builds under
          # QEMU, which takes far longer than a native build.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only now that the image is on Docker Hub. Re-running for a tag whose
      # release already exists updates it instead of failing, so a partial run
      # can be finished by running this workflow again.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ steps.meta.outputs.tag }}'
          prerelease='${{ steps.meta.outputs.prerelease }}'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --notes-file release-notes.md \
              --prerelease="$prerelease" --draft=false
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "$tag" --notes-file release-notes.md \
              --prerelease="$prerelease"
          fi

      # The installer of this release and its checksum, so an install can be
      # pinned to a version and verified before it runs (issue #373). The
      # asset clones this release; see scripts/build_installer_asset.py.
      - name: Attach the installer and its checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ steps.meta.outputs.tag }}'
          python scripts/build_installer_asset.py "$tag" dist
          gh release upload "$tag" dist/install.sh dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber

      - name: Summarise what was published
        run: |
          {
            echo "### Published ${{ steps.meta.outputs.tag }}"
            echo ''
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # New Endpoints install the release pinned in sci-ndp/NDP-EP's setup.sh
  # (issue #400, sci-ndp/NDP-EP#16). This opens the one-line pull request there
  # that raises the pin; merging it is what makes new installations use this
  # release, and closing it holds the release back. It runs here rather than
  # on the `release` event because a release created with the workflow's own
  # token starts no other workflow.
  #
  # NDP_EP_PR_TOKEN: a token that can push a branch to sci-ndp/NDP-EP and open
  # pull requests there (fine-grained: Contents and Pull requests, read and
  # write, on that repository only).
  propose-ndp-ep-bump:
    needs: publish
    if: needs.publish.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Open the pull request that installs this release from NDP-EP
        env:
          GH_TOKEN: ${{ secrets.NDP_EP_PR_TOKEN }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The NDP_EP_PR_TOKEN secret is not set, so no pull request was opened in sci-ndp/NDP-EP. Raise EP_VERSION in its setup.sh to $TAG by hand, or set the secret and re-run this job."
            exit 1
          fi
          branch="ep-api-$TAG"
          git clone --quiet --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/sci-ndp/NDP-EP.git" ndp-ep
          # Re-running the workflow must not open a second pull request.
          if git -C ndp-ep ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "Branch $branch already exists in sci-ndp/NDP-EP; nothing to do."
            exit 0
          fi
          status=0
          python3 scripts/bump_ndp_ep.py "$TAG" ndp-ep/setup.sh || status=$?
          if [ "$status" -eq 10 ]; then
            exit 0
          fi
          [ "$status" -eq 0 ] || exit "$status"
          cd ndp-ep
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --quiet -b "$branch"
          git commit --quiet -am "Install ep-api $TAG"
          git push --quiet origin "$branch"
          notes="https://github.com/national-data-platform/ep-api/releases/tag/$TAG"
          gh pr create --repo sci-ndp/NDP-EP --base main --head "$branch" \
            --title "Install ep-api $TAG" \
            --body "Raises \`EP_VERSION\` in \`setup.sh\` to $TAG, so new Endpoints install it once this is merged. Close it to keep new installations on the current release.

          Release notes: $notes

          Opened by the release workflow of national-data-platform/ep-api (#400)."
