name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black flake8

      - name: Run Black (formatting check)
        run: black --check --diff .

      - name: Run Flake8 (linting)
        run: flake8 api/ tests/ scripts/ --max-line-length=88 --extend-ignore=E203,W503,E501,F401

      - name: Run tests with coverage
        run: |
          pytest tests/ install/tests/ -v --cov=api --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  ui-test:
    name: Web UI tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 18 matches the ui-builder stage of Dockerfile.allinone, so the
      # tests run against the same toolchain that builds the shipped bundle.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      # react-scripts watches for changes by default, which would hang the
      # runner; --watchAll=false makes it run once and exit.
      - name: Run tests
        working-directory: ui
        run: npm test -- --watchAll=false
        env:
          CI: true
